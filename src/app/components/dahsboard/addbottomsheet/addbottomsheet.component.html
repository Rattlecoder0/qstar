<div class="bottom_sheet_content">
  <h4>Do you want to enter name of the person ?</h4>
  <input type="text" placeholder="Name" class="person_name_input" [formControl]="personName" >
  <span *ngIf="personName?.errors?.['required']" class="err_mesg">Enter person name</span>
  <div class="btns_box">
    <button mat-button class="skip" (click)="addPerson('skip')">Skip</button>
    <button mat-flat-button class="add" (click)="addPerson('add')">Add</button>
  </div>
</div>
